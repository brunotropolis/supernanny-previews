-02.jpg", "dur": null, "alt": false}], "notas": {"01": "Botão QUERO com o link do ninho (o vídeo já foi cortado antes do 'comenta')"}, "links": ["Ninho: Shopee https://s.shopee.com.br/7fSXXChDUE | Amazon https://link.amazon/B08uowNkR | ML https://meli.la/337miRB", "Grupo As Ofertas Maternas: https://asofertasmaternas.com.br/?utm_source=instagram&utm_medium=stories"], "drive": null}];
const MODO = "github";   // "github": sem banco, guarda no aparelho e copia o texto pra colar no chat
const estado = {};            // id do dia > {status, comentario}
let filtro = "todos", db = null, podeEscrever = true;

const el = (t, a = {}, ...f) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); } for (const x of f) if (x != null) e.append(x); return e; };
const rotulo = s => ({aprovado: "Aprovado", ajuste: "Ajuste pedido"}[s] || "Pendente");

function filtros() {
  const c = {todos: DIAS.length, pendente: 0, ajuste: 0, aprovado: 0};
  for (const d of DIAS) c[(estado[d.id] || {}).status || "pendente"]++;
  const nomes = [["todos", "Todos"], ["pendente", "Pendentes"], ["ajuste", "Com ajuste"], ["aprovado", "Aprovados"]];
  const box = document.getElementById("filtros"); box.replaceChildren();
  for (const [k, n] of nomes) box.append(el("button", {class: "filtro", "aria-pressed": String(filtro === k), onclick: () => { filtro = k; render(); }}, `${n} · ${c[k]}`));
}

function cartao(d) {
  const st = estado[d.id] || {status: "pendente"};
  const faixa = el("div", {class: "faixa"});
  d.stories.forEach(s => {
    const n = s.n.replace(/^0/, "");
    const b = el("button", {"aria-label": `Ver story ${s.n} do dia ${d.n}`, onclick: () => abrir(s, d)},
      el("img", {src: s.img, alt: "", loading: "lazy"}), el("span", {class: "tag"}, s.alt ? "extra" : n),
      s.dur ? el("span", {class: "vid"}, `▶ ${s.dur}s`) : null);
    faixa.append(el("div", {class: "st" + (s.alt ? " alt" : "")}, b, d.notas[s.n] || s.alt ? el("div", {class: "leg"}, s.alt ? s.n.replace(/^\d+-?/, "") : d.notas[s.n]) : null));
  });
  const det = el("details", {}, el("summary", {}, "Links e figurinhas do dia"),
    el("ul", {}, ...d.links.map(l => el("li", {}, l)), ...Object.entries(d.notas).map(([k, v]) => el("li", {}, `Story ${k}: ${v}`))));
  const acoes = el("div", {class: "acoes"});
  const area = el("div", {class: "wrap", style: "gap:8px;max-width:none"});
  if (st.status === "ajuste" && st.comentario) area.append(el("div", {class: "coment"}, "Seu pedido: " + st.comentario));
  if (MODO === "github" || (podeEscrever && db)) {
    if (st.status !== "aprovado") acoes.append(el("button", {class: "btn ok", onclick: e => salvar(d, "aprovado", "", e.target)}, "Aprovar"));
    acoes.append(el("button", {class: "btn aj", onclick: () => { area.replaceChildren(caixa(d, st)); }}, st.status === "ajuste" ? "Editar ajuste" : "Pedir ajuste"));
    if (st.status !== "pendente") acoes.append(el("button", {class: "btn sec", onclick: e => salvar(d, "pendente", "", e.target)}, "Desfazer"));
  }
  if (d.drive) acoes.append(el("a", {class: "drive", href: d.drive, target: "_blank", rel: "noopener"}, "Abrir no Drive"));
  return el("article", {class: "dia", id: d.id},
    el("div", {class: "dia-top"}, el("div", {}, el("h2", {}, `Dia ${d.n} · ${d.tema}`), el("div", {class: "quando"}, `${d.dia}, ${d.data}`)),
      el("span", {class: "chip " + st.status}, rotulo(st.status))),
    faixa, det, area, acoes);
}

function caixa(d, st) {
  const id = "aj-" + d.id;
  const t = el("textarea", {id, placeholder: "Ex.: story 2, trocar a frase por …"});
  t.value = st.comentario || "";
  const ok = el("button", {class: "btn aj", onclick: e => { const v = t.value.trim(); if (v) salvar(d, "ajuste", v, e.target); else t.focus(); }}, "Enviar ajuste");
  setTimeout(() => t.focus(), 0);
  return el("div", {class: "wrap", style: "gap:8px;max-width:none"}, el("label", {for: id, class: "sub", style: "margin:0"}, "O que mudar neste dia?"), t, el("div", {class: "acoes"}, ok, el("button", {class: "btn sec", onclick: render}, "Cancelar")));
}

function guardarLocal() { try { localStorage.setItem("aprov-stories", JSON.stringify(estado)); } catch (e) {} }

async function salvar(d, status, comentario, botao) {
  if (MODO === "github") {
    if (status === "pendente") delete estado[d.id]; else estado[d.id] = {status, comentario};
    guardarLocal(); render(); return;
  }
  if (botao) botao.disabled = true;
  try {
    await db.doc("aprovacoes/" + d.id).set({dia: d.n, status, comentario, em: new Date().toISOString()});
  } catch (e) {
    if (e && e.code === "invalid_argument") { podeEscrever = false; aviso("Você está só vendo esta página. Pra aprovar, peça acesso de edição ao Bruno."); }
    else aviso("Não consegui salvar agora. Tente de novo em instantes.");
    if (botao) botao.disabled = false;
  }
}

function aviso(t) { const a = document.getElementById("aviso"); a.textContent = t; a.hidden = !t; }

function render() {
  filtros();
  const box = document.getElementById("dias"); box.replaceChildren();
  const lista = DIAS.filter(d => filtro === "todos" || ((estado[d.id] || {}).status || "pendente") === filtro);
  if (!lista.length) box.append(el("p", {class: "sub"}, "Nenhum dia aqui."));
  lista.forEach(d => box.append(cartao(d)));
}

function abrir(s, d) {
  document.getElementById("zoom-img").src = s.img;
  document.getElementById("zoom-leg").textContent = `Dia ${d.n}, story ${s.n}` + (s.dur ? ` · vídeo de ${s.dur}s (abra no Drive pra assistir)` : "");
  document.getElementById("zoom").hidden = false;
}
document.getElementById("zoom").addEventListener("click", () => { document.getElementById("zoom").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("zoom").hidden = true; });

function textoAjustes() {
  const linhas = DIAS.map(d => { const s = estado[d.id]; if (!s) return null;
    return s.status === "aprovado" ? `Dia ${d.n} (${d.data}): aprovado` : `Dia ${d.n} (${d.data}): ${s.comentario}`; }).filter(Boolean);
  return linhas.length ? "Revisão dos stories (dias " + DIAS[0].n + " a " + DIAS[DIAS.length - 1].n + ")

" + linhas.join("
") : "";
}

if (MODO === "github") {
  try { Object.assign(estado, JSON.parse(localStorage.getItem("aprov-stories") || "{}")); } catch (e) {}
  const barra = document.getElementById("copiar"); barra.hidden = false;
  document.getElementById("btn-copiar").addEventListener("click", async () => {
    const t = textoAjustes(), msg = document.getElementById("copiar-msg");
    if (!t) { msg.textContent = "Marque pelo menos um dia antes de copiar."; return; }
    try { await navigator.clipboard.writeText(t); msg.textContent = "Copiado! Agora é só colar na conversa com o Claude."; }
    catch (e) { const ta = document.getElementById("copiar-texto"); ta.hidden = false; ta.value = t; ta.select(); msg.textContent = "Selecionei o texto: copie e cole na conversa com o Claude."; }
  });
  document.querySelector(".sub").textContent = "Toque num story pra ver maior. Em cada dia, toque em Aprovar ou escreva o ajuste. No fim, toque em Copiar meus ajustes e cole na conversa com o Claude.";
}

render();

(async () => {
  if (MODO === "github") return;
  const timer = setTimeout(() => aviso("As aprovações ainda não carregaram. Se continuar assim, recarregue a página."), 10000);
  db = await claude.use("db").catch(() => null);
  if (!db) { clearTimeout(timer); aviso("Pra aprovar, abra esta página logada no claude.ai com a conta que o Bruno compartilhou."); render(); return; }
  try { const u = await claude.use("user"); const p = u && await u.can("data.write"); if (p === false) { podeEscrever = false; aviso("Você está só vendo esta página. Pra aprovar, peça acesso de edição ao Bruno."); } } catch (e) {}
  db.collection("aprovacoes").onSnapshot(snap => {
    for (const k in estado) delete estado[k];
    snap.docs.forEach(x => { if (x.exists) estado[x.id] = x.data(); });
    if (!snap.metadata.fromCache) { clearTimeout(timer); if (podeEscrever) aviso(""); }
    render();
  }, () => { clearTimeout(timer); aviso("As aprovações pararam de atualizar. Recarregue a página."); });
  render();
})();
</script>
