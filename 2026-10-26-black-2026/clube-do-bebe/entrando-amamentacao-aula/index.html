<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Entrando no grupo...</title>
<meta name="theme-color" content="#160A12">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap">
<script src="../../assets/black.js" defer></script>
<style>
:root{--bg:#160A12;--bg2:#2A0F1F;--txt:#F6EEF7;--mut:#D6C8DA;--cor:#F08A6A;--cor2:#FFB497;--glow:240,138,106;
  --fd:"Montserrat",system-ui,sans-serif;--fb:"Nunito Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{display:grid;place-items:center;padding:24px max(18px,env(safe-area-inset-left));color:var(--txt);font-family:var(--fb);line-height:1.55;
  background:radial-gradient(60% 45% at 50% 38%,rgba(var(--glow),.28),transparent 70%),linear-gradient(180deg,var(--bg),var(--bg2))}
.box{max-width:430px;width:100%;text-align:center;display:grid;gap:22px;justify-items:center}
.anel{width:128px;height:128px;position:relative;border-radius:50%;box-shadow:0 0 34px rgba(var(--glow),.45),inset 0 0 22px rgba(var(--glow),.25)}
.anel svg{width:128px;height:128px;transform:rotate(-90deg)}
.anel circle{fill:none;stroke-width:8}
.anel .f{stroke:rgba(255,255,255,.08)}
.anel .p{stroke:var(--cor);stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transition:stroke-dashoffset 3s cubic-bezier(.4,0,.2,1)}
.anel .ic{position:absolute;inset:0;display:grid;place-items:center;color:var(--cor2)}
.anel .ic svg{width:46px;height:46px;transform:none;animation:pulsa 1.4s ease-in-out infinite}
@keyframes pulsa{50%{transform:scale(1.12)}}
h1{font-family:var(--fd);font-weight:900;font-size:clamp(1.4rem,6vw,1.75rem);line-height:1.18;text-wrap:balance}
h1 b{color:var(--cor2)}
.frase{font-size:1.05rem;color:var(--mut);max-width:34ch;text-wrap:balance}
.frase b{color:var(--txt)}
.frase .d{color:var(--cor2);font-weight:800}
.lg-clube{position:absolute;left:50%;top:-112px;transform:translateX(-50%);width:210px;max-width:none;height:auto}
.anel{margin-top:100px}
.aviso{display:none;font-size:.82rem;color:var(--mut);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 16px}
.aviso.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="box">
  <div class="anel"><svg viewBox="0 0 120 120"><circle class="f" cx="60" cy="60" r="52"/><circle class="p" cx="60" cy="60" r="52"/></svg>
    <img class="lg-clube" src="../../assets/clube-fita-escuro.webp" alt="Clube do Bebê" width="882" height="354"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.6.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.21 3.07.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.69.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35M12.05 21.79h-.01a9.9 9.9 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.9-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.89 9.88m8.41-18.29A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.16-3.48-8.41"/></svg></span></div>
  <h1><span id="oi">Tudo certo!</span><br>Vou te direcionar para <b>um dos nossos grupos</b></h1>
  <p class="frase">Só quem estiver no grupo verá a aula <b>mamando ou chupetando</b> na terça-feira, <span class="d" data-data-curta>10/11</span>.</p>
  <p class="aviso" id="aviso">Prévia: o link do grupo entra aqui quando a ferramenta de grupos estiver pronta.</p>
</main>
<script>
(function(){
  try{var n=sessionStorage.getItem('primeiroNome');if(n)document.getElementById('oi').textContent='Tudo certo, '+n+'!';}catch(e){}
  requestAnimationFrame(function(){requestAnimationFrame(function(){document.querySelector('.anel .p').style.strokeDashoffset='0';});});
  // ~3 segundos de carregamento e vai direto pro grupo, sem botão
  setTimeout(function(){
    var link=(window.CONFIG&&CONFIG.linkGrupo['clube-do-bebe'])||'';
    if(link)location.replace(link);
    else document.getElementById('aviso').classList.add('on');
  },3200);
})();
</script>
</body>
</html>
