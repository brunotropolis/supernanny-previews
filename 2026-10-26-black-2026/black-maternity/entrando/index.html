<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Entrando no grupo...</title>
<meta name="theme-color" content="#0B0B0F">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,800;1,900&family=Nunito+Sans:wght@400;600;700&display=swap">
<script src="../../assets/black.js" defer></script>
<style>
:root{--bg:#0B0B0F;--card:#16161D;--line:#2A2A35;--txt:#F4F4F7;--mut:#CFCFDA;
  --cor:#E21F82;--cor2:#FF4FA6;--glow:226,31,130;--btn:#ffffff;
  --fd:"Montserrat",system-ui,sans-serif;--fb:"Nunito Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
img{max-width:100%;display:block}
.wrap{max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
h1,h2,h3{font-family:var(--fd);line-height:1.15;text-wrap:balance}
em{font-style:normal;color:var(--cor)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
html,body{height:100%}
body{display:grid;place-items:center;background:radial-gradient(60% 45% at 50% 40%,rgba(var(--glow),.22),transparent 70%),var(--bg);padding:24px max(18px,env(safe-area-inset-left))}
.box{max-width:420px;width:100%;text-align:center;display:grid;gap:18px;justify-items:center}
.lg .lg-img{width:220px;height:auto}
.anel{width:120px;height:120px;position:relative}
.anel svg{width:120px;height:120px;transform:rotate(-90deg)}
.anel circle{fill:none;stroke-width:8}
.anel .f{stroke:rgba(255,255,255,.08)}
.anel .p{stroke:var(--cor);stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transition:stroke-dashoffset 3.2s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 0 8px rgba(var(--glow),.8))}
.anel .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:2.3rem}
h1{font-size:1.45rem;font-weight:900}
h1 b{color:var(--cor)}
.passos{list-style:none;padding:0;display:grid;gap:12px;text-align:left;width:100%;max-width:320px;margin:0 auto}
.passos li{display:flex;gap:10px;align-items:flex-start;line-height:1.4;color:var(--mut);font-size:.95rem;opacity:.35;transition:opacity .4s}
.passos li.on{opacity:1;color:var(--txt)}
.passos li i{margin-top:1px;width:22px;height:22px;border-radius:50%;border:2px solid var(--cor);display:grid;place-items:center;font-style:normal;font-size:.75rem;color:var(--btn);flex:0 0 22px}
.passos li.ok i{background:var(--cor)}
.btn{display:none;font-family:var(--fd);font-weight:800;text-transform:uppercase;font-size:.92rem;color:var(--btn);background:var(--cor);border-radius:999px;padding:15px 24px;text-decoration:none}
.btn.on{display:inline-block}
.aviso{display:none;font-size:.85rem;color:var(--mut);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:16px;margin-top:8px}
.aviso.on{display:block}
</style>
</head>
<body>
<main class="box">
  <div class="anel"><svg viewBox="0 0 120 120"><circle class="f" cx="60" cy="60" r="52"/><circle class="p" cx="60" cy="60" r="52"/></svg><span class="ic">💬</span></div>
  <h1><span id="oi">Tudo certo!</span><br>Vou te direcionar pro nosso <b>grupo mais recente</b></h1>
  <ul class="passos">
    <li><i>✓</i>Inscrição confirmada</li>
    <li><i>✓</i>Procurando o grupo VIP da Black Maternity desta semana</li>
    <li><i>✓</i>Abrindo o WhatsApp</li>
  </ul>
  <a class="btn" id="btn" href="#">Entrar no grupo agora →</a>
  <p class="aviso" id="aviso">Prévia: o link do grupo entra aqui quando a ferramenta de grupos estiver pronta.</p>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search),tema=q.get('tema');
  var T={"amarelo":{"cor":"#FFC928","cor2":"#FFE07A","glow":"255,201,40","btnTxt":"#1A1300"},"laranja":{"cor":"#FF7A1A","cor2":"#FFB070","glow":"255,122,26","btnTxt":"#1F0C00"},"azul":{"cor":"#2F8CFF","cor2":"#8EC2FF","glow":"47,140,255","btnTxt":"#04122A"},"rosa":{"cor":"#FF4FA3","cor2":"#FF9CCB","glow":"255,79,163","btnTxt":"#2A0716"},"magenta":{"cor":"#E21F82","cor2":"#FF4FA6","glow":"226,31,130","btnTxt":"#ffffff"}};
  if(tema&&T[tema]){var r=document.documentElement.style;r.setProperty('--cor',T[tema].cor);r.setProperty('--cor2',T[tema].cor2);r.setProperty('--glow',T[tema].glow);r.setProperty('--btn',T[tema].btnTxt);}
  try{var n=sessionStorage.getItem('primeiroNome');if(n)document.getElementById('oi').textContent='Tudo certo, '+n+'!';}catch(e){}
  var lis=document.querySelectorAll('.passos li');
  requestAnimationFrame(function(){document.querySelector('.anel .p').style.strokeDashoffset='0';});
  [0,1100,2200].forEach(function(t,i){setTimeout(function(){lis[i].classList.add('on');setTimeout(function(){lis[i].classList.add('ok')},700)},t)});
  setTimeout(function(){
    var link=(window.CONFIG&&CONFIG.linkGrupo['black-maternity'])||'';
    var b=document.getElementById('btn');
    if(link){b.href=link;b.classList.add('on');location.href=link;}
    else document.getElementById('aviso').classList.add('on');
  },3400);
})();
</script>
</body>
</html>
